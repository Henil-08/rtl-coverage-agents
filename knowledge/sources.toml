# Sources for the planner's knowledge base.
#
#   uv run python -m rag build      download everything below into knowledge/docs/ and index it
#
# Nothing downloaded is committed: every document stays under its publisher's licence and lives only
# on your machine (knowledge/docs/ and knowledge/index/ are gitignored). To grow the corpus, add an
# entry below or drop PDF, HTML, Markdown or text files into knowledge/docs/ and run
# `uv run python -m rag index`.
#
# Entry types:
#   [[doc]]             one URL (PDF, HTML or Markdown); the title is read from the document
#   [[arxiv]]           an arXiv API search; every hit's PDF is downloaded, three seconds apart
#   [[github_release]]  PDF assets of a repository's latest GitHub release
#   [[local]]           files already on disk, matched by a glob relative to the repository root

[[local]]
glob = "third_party/uvm/src/**/*.svh"
title = "UVM 2020 library source (verilator/uvm)"

[[local]]
glob = "third_party/uvm/docs/**/*.md"
title = "UVM 2020 library notes (verilator/uvm)"

[[github_release]]
repo = "riscv/riscv-isa-manual"
title = "RISC-V Instruction Set Manual"

[[arxiv]]
query = 'all:"hardware verification" AND all:"language model"'
max = 25

[[arxiv]]
query = 'all:"functional coverage" AND cat:cs.AR'
max = 15

[[arxiv]]
query = 'all:"assertion generation" AND cat:cs.AR'
max = 15

[[arxiv]]
query = 'all:"testbench generation"'
max = 10

[[arxiv]]
query = 'all:"coverage closure"'
max = 10

[[arxiv]]
query = 'all:"design verification" AND cat:cs.AR'
max = 20

[[arxiv]]
query = 'all:"mutation" AND all:"RTL"'
max = 10

[[arxiv]]
query = 'all:"UVM" AND all:"verification"'
max = 10

