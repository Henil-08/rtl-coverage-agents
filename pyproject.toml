[project]
name = "ai-in-hardware"
version = "0.1.0"
description = "Coverage-guided SystemVerilog verification agents on Verilator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-groq>=1.0",
    "mcp>=2.0",
    "python-dotenv>=1.0",
    "pypdf>=6.21.1",
    "rank-bm25>=0.2.2",
    "fastembed>=0.9.0",
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "langchain-openai>=1.7.2",
    "langchain-anthropic>=1.7.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
